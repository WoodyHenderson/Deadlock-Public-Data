          ],
          "source": "github.deadlock-data.english.311b2e8d895e",
          "raw_text": "Channel to start launching projectiles that <span class=\"highlight\">deal {g:citadel_inline_attribute:'SpiritDamage'}</span> and <span class=\"highlight\">apply {g:citadel_inline_attribute:'Slow'}</span> around their impact point. Projectiles that hit a hero grant Pocket <span class=\"highlight\">{g:citadel_inline_attribute:'DamageAmp'} that stacks</span>.<br>Casting while airborne will cause Pocket to <span class=\"highlight\">float</span>.<span class=\"diminish\"><br><br>Casting AirDash or Flying Cloaking will not cancel Barrage.</span>",
          "plain_text": "Channel to start launching projectiles that deal spirit damage and apply slow around their impact point. Projectiles that hit a hero grant Pocket increased damage that stacks.\nCasting while airborne will cause Pocket to float.\nCasting AirDash or Flying Cloaking will not cancel Barrage."
