          "source": "github.deadlock-data.english.311b2e8d895e",
          "raw_text": "<span class=\"highlight\">Grab an ally</span> and <span class=\"highlight\">take flight</span> with them. Drop your ally to cause an explosion, dealing {g:citadel_inline_attribute:'SpiritDamage'}. You and your ally gain increased Outgoing Damage when flying ends. <span class=\"diminish\"><br><br>Cooldown reduced by 30% when used on allies.<br>Taking damage briefly disables using the ability.<br>While lifted, your ally cannot attack and deals -20% damage.</span>",
          "plain_text": "Grab an ally and take flight with them. Drop your ally to cause an explosion, dealing spirit damage. You and your ally gain increased Outgoing Damage when flying ends.\nCooldown reduced by 30% when used on allies.\nTaking damage briefly disables using the ability.\nWhile lifted, your ally cannot attack and deals -20% damage."
        },
