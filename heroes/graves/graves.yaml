          "source": "github.deadlock-data.english.311b2e8d895e",
          "raw_text": "<span class=\"diminish\">Passive:</span> Collect <span class=\"highlight\">death</span> when anything dies nearby and store it in your Jar of Dead.<br><br><span class=\"diminish\">Active:</span> Throw a jar to summon <span class=\"highlight\">Deadheads</span> that repeatedly deal {g:citadel_inline_attribute:'SpiritDamage'} to enemies. <br><br>Deadheads follow you instead if there's no nearby enemies, and prioritize the target of your weapon.",
          "plain_text": "Passive: Collect death when anything dies nearby and store it in your Jar of Dead.\nActive: Throw a jar to summon Deadheads that repeatedly deal spirit damage to enemies.\nDeadheads follow you instead if there's no nearby enemies, and prioritize the target of your weapon."
        },
