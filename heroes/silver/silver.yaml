          "source": "github.deadlock-data.english.311b2e8d895e",
          "raw_text": "<span class=\"diminish\">Passive: </span>Dealing damage generates bloodlust, increased at low health. At max bloodlust, you automatically cast Lycan Curse.<br><br><span class=\"diminish\">Active:</span> Instantly transform, gaining increased {g:citadel_inline_attribute:'MaxHealth'}, and stacking {g:citadel_inline_attribute:'FireRate'} on enemy heroes, and <span class=\"highlight\">replacing your abilities and weapon</span> with their ferocious versions.",
