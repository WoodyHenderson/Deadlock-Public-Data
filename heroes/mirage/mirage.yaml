          "source": "github.deadlock-data.english.311b2e8d895e",
          "raw_text": "Active: <span class=\"highlight\">Consume</span> all Djinn Mark's to deal its damage now.",
          "plain_text": "Active: Consume all Djinn Mark's to deal its damage now."
        },
        {
          "localization_key": "mirage_sand_phantom_passive_desc",
          "card_paths": [
            "card.Info1.DescKey"
          ],
          "source": "github.deadlock-data.english.311b2e8d895e",
          "raw_text": "Passive: Your shots <span class=\"highlight\">apply a Djinn Mark</span> on the target. When the mark expires or is consumed, it deals {g:citadel_inline_attribute:'SpiritDamage'} and the target is briefly <span class=\"highlight\">revealed on the map</span>. Each added mark doubles the current damage.<br><span class=\"diminish\"><br>There is a per target Cooldown for applying additional marks</span>",
          "plain_text": "Passive: Your shots apply a Djinn Mark on the target. When the mark expires or is consumed, it deals spirit damage and the target is briefly revealed on the map. Each added mark doubles the current damage.\nThere is a per target Cooldown for applying additional marks"
        },
        {
          "localization_key": "mirage_sand_phantom_t1_desc",
          "card_paths": [
            "card.Upgrades[0].DescKey"
          ],
          "source": "github.deadlock-data.english.311b2e8d895e",
          "raw_text": "On Proc: Apply a fading <span class=\"highlight\">60%</span> Slow for <span class=\"highlight\">0.8s</span>",
          "plain_text": "On Proc: Apply a fading 60% Slow for 0.8s"
        },
        {
          "localization_key": "mirage_sand_phantom_t2_desc",
          "card_paths": [
            "card.Upgrades[1].DescKey"
          ],
          "source": "github.deadlock-data.english.311b2e8d895e",
          "raw_text": "<span class=\"highlight\">+20</span> Base Damage and <span class=\"highlight\">+3s</span> Multiplier Duration",
          "plain_text": "+20 Base Damage and +3s Multiplier Duration"
        },
        {
          "localization_key": "mirage_sand_phantom_t3_desc",
          "card_paths": [
