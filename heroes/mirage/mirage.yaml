          ],
          "source": "github.deadlock-data.english.311b2e8d895e",
          "raw_text": "<span class=\"highlight\">-0.75s</span> Cooldown <br><span class=\"highlight\">+1</span> Max Marks <br>Stun Victim for <span class=\"highlight\">0.5s</span> on Max Marks",
