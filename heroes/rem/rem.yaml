      "descriptions": [
        {
          "localization_key": "ability_familiar_helpinghands_desc",
          "card_paths": [
            "card.DescKey",
            "card.Info1.DescKey"
          ],
          "source": "github.deadlock-data.english.311b2e8d895e",
          "raw_text": "Signal a Helper to lend a hand. They can collect boxes, do Sinner's Sacrifices, or be sent to support allies and troopers.<br><br><span class=\"diminish\">Follow a hero:</span> Provides a short burst of {g:citadel_inline_attribute:'SpiritResist'} and fading {g:citadel_inline_attribute:'MoveSpeed'}.<br><br><span class=\"diminish\">Follow a trooper:</span> Provides <span class=\"highlight\">healing, damage, resists, and allows tagging along.</span> When no hero is around, souls from trooper kills are split amongst the team.<br><br><span class=\"diminish\">Can be cast during Tag Along. Helpers will take a nap for 15.1s after following someone.</span>",
          "plain_text": "Signal a Helper to lend a hand. They can collect boxes, do Sinner's Sacrifices, or be sent to support allies and troopers.\nFollow a hero: Provides a short burst of spirit resist and fading move speed.\nFollow a trooper: Provides healing, damage, resists, and allows tagging along. When no hero is around, souls from trooper kills are split amongst the team.\nCan be cast during Tag Along. Helpers will take a nap for 15.1s after following someone."
        },
        {
          "localization_key": "ability_familiar_helpinghands_t1_desc",
          "card_paths": [
            "card.Upgrades[0].DescKey"
          ],
          "source": "github.deadlock-data.english.311b2e8d895e",
          "raw_text": "+1 Helper<br>+1.5m/s Move Speed",
