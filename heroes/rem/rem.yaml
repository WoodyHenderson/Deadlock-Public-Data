      "descriptions": [
        {
          "localization_key": "ability_familiar_attach_desc",
          "card_paths": [
            "card.DescKey",
            "card.Info1.DescKey"
          ],
          "source": "github.deadlock-data.english.311b2e8d895e",
          "raw_text": "Jump to an ally and nap alongside them. Both you and the ally receive a burst {g:citadel_inline_attribute:'Heal'} based on missing health followed by lingering {g:citadel_inline_attribute:'Regen'}.<br><br>Hop between allies with {g:citadel_binding:'Ability2'} to apply the heal, once per ally.<br><br><span class=\"diminish\">You are knocked off if stunned by an ultimate ability.<br>You can use items and all self-casts target your ally instead.</span>",
          "plain_text": "Jump to an ally and nap alongside them. Both you and the ally receive a burst heal based on missing health followed by lingering regeneration.\nHop between allies with [Ability 2] to apply the heal, once per ally.\nYou are knocked off if stunned by an ultimate ability.\nYou can use items and all self-casts target your ally instead."
        },
        {
          "localization_key": "ability_familiar_attach_t2_desc",
          "card_paths": [
            "card.Upgrades[1].DescKey"
          ],
          "source": "github.deadlock-data.english.311b2e8d895e",
          "raw_text": "35% Bonus Item Range, Duration, and Barrier Effectiveness while napping",
          "plain_text": "35% Bonus Item Range, Duration, and Barrier Effectiveness while napping"
        },
        {
          "localization_key": "ability_familiar_attach_t3_desc",
          "card_paths": [
            "card.Upgrades[2].DescKey"
          ],
          "source": "github.deadlock-data.english.311b2e8d895e",
          "raw_text": "+15% Spirit Power and +35 Spirit Power while napping and for 10s after napping<br>Improved Spirit Scaling",
          "plain_text": "+15% Spirit Power and +35 Spirit Power while napping and for 10s after napping\nImproved Spirit Scaling"
        }
