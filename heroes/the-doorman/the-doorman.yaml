          "source": "github.deadlock-data.english.311b2e8d895e",
          "raw_text": "Send the target's physical body to be a guest at the Baroness Hotel. The guest is to promptly make their way to the exit elevator, where they'll be sent back to their original position. <br><br>A stay at the Baroness Hotel is paid for in {g:citadel_inline_attribute:'SpiritDamage'}. Failure to check-out on time costs additional {g:citadel_inline_attribute:'SpiritDamage'}.",
