      "descriptions": [
        {
          "localization_key": "ability_doorman_bomb_desc",
          "card_paths": [
            "card.DescKey",
            "card.Info1.DescKey"
          ],
          "source": "github.deadlock-data.english.311b2e8d895e",
          "raw_text": "Throw out a call bell that deals {g:citadel_inline_attribute:'SpiritDamage'} on impact. After a short delay it explodes, dealing additional {g:citadel_inline_attribute:'SpiritDamage'} and causing affected enemies to suffer reduced weapon accuracy and movement {g:citadel_inline_attribute:'Slow'}.<br><br><span class=\"diminish\">Can be shot to detonate early.</span>",
          "plain_text": "Throw out a call bell that deals spirit damage on impact. After a short delay it explodes, dealing additional spirit damage and causing affected enemies to suffer reduced weapon accuracy and movement slow.\nCan be shot to detonate early."
        },
        {
          "localization_key": "ability_doorman_bomb_t1_desc",
          "card_paths": [
            "card.Upgrades[0].DescKey"
          ],
          "source": "github.deadlock-data.english.311b2e8d895e",
          "raw_text": "+1 Charge",
          "plain_text": "+1 Charge"
        },
        {
          "localization_key": "ability_doorman_bomb_t2_desc",
          "card_paths": [
            "card.Upgrades[1].DescKey"
          ],
          "source": "github.deadlock-data.english.311b2e8d895e",
          "raw_text": "+30 Impact Damage<br>+40 Explosion Damage",
          "plain_text": "+30 Impact Damage\n+40 Explosion Damage"
        },
        {
          "localization_key": "ability_doorman_bomb_t3_desc",
