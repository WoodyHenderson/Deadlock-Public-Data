          "source": "github.deadlock-data.english.311b2e8d895e",
          "raw_text": "Chain nearby enemies to you. Chained enemies <span class=\"highlight\">cannot use movement abilities</span> and receive a heavy {g:citadel_inline_attribute:'Slow'} when they pull on the chain.<br><br>After a delay, <span class=\"highlight\">yank everyone towards Billy</span> and deal {g:citadel_inline_attribute:'SpiritDamage'}.<br><br><span class=\"diminish\">The chain breaks if you lose line of sight for a short while.</span>",
          "plain_text": "Chain nearby enemies to you. Chained enemies cannot use movement abilities and receive a heavy slow when they pull on the chain.\nAfter a delay, yank everyone towards Billy and deal spirit damage.\nThe chain breaks if you lose line of sight for a short while."
        },
