          "source": "github.deadlock-data.english.311b2e8d895e",
          "raw_text": "Your bullets apply additional {g:citadel_inline_attribute:'SpiritDamage'}. Dealing damage your abilities builds up to a vicious <span class=\"highlight\">bite</span>, dealing a burst of {g:citadel_inline_attribute:'BonusSpiritDamage'}. <br><br><span class=\"diminish\">Love Bites has a unique cooldown per target.</span>",
