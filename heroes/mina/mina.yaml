          "card_paths": [
            "card.Upgrades[2].DescKey"
          ],
          "source": "github.deadlock-data.english.311b2e8d895e",
          "raw_text": "<span class=\"highlight\">+7%</span> Missing health damage and increased Heal per Kill Spirit scaling",
          "plain_text": "+7% Missing health damage and increased Heal per Kill Spirit scaling"
