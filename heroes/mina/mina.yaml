          ],
          "source": "github.deadlock-data.english.311b2e8d895e",
          "raw_text": "<span class=\"diminish\">Active:</span> Slash with your umbrella, dealing {g:citadel_inline_attribute:'SpiritDamage'}, increasing with their missing health. Receive a {g:citadel_inline_attribute:'Heal'} for every target killed.<br><br><span class=\"diminish\">Passive: </span>Holding {g:citadel_binding:'ADS'} causes you to briefly float.<br><span class=\"diminish\">Rake executes non-heroes below 60 health.</span>",
          "plain_text": "Active: Slash with your umbrella, dealing spirit damage, increasing with their missing health. Receive a heal for every target killed.\nPassive: Holding [ADS] causes you to briefly float.\nRake executes non-heroes below 60 health."
        },
        {
          "localization_key": "ability_vampirebat_steallife_t2_desc",
          "card_paths": [
            "card.Upgrades[1].DescKey"
          ],
          "source": "github.deadlock-data.english.311b2e8d895e",
          "raw_text": "<span class=\"highlight\">+30</span> Heal per Kill <br><span class=\"highlight\">-8s</span> Cooldown",
          "plain_text": "+30 Heal per Kill\n-8s Cooldown"
        },
        {
