          "source": "github.deadlock-data.english.311b2e8d895e",
          "raw_text": "Create a tether that <span class=\"highlight\">drains enemy health over time</span> and <span class=\"highlight\">heals you</span>. Target must be in line of sight and within max range to drain. You can shoot and use other abilities during the drain, but your move speed is reduced. <br><span class=\"highlight\">{g:citadel_binding:'AltCast'} to give health to friendly Heroes</span>.",
