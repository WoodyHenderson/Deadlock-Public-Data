          "source": "github.deadlock-data.english.7fd1dfeb502a",
          "raw_text": "Your bench's legs extend, granting {g:citadel_inline_attribute:'BonusMoveSpeed'}, higher jumps, <span class=\"highlight\">Debuff Resistance</span> and <span class=\"highlight\">Melee Resistance</span>.<br><br><span class=\"diminish\">Light Melee:</span> Perform a <span class=\"highlight\">kick</span> that knocks enemies back.<br><span class=\"diminish\">Heavy Melee:</span> Perform a <span class=\"highlight\">ground pound</span> that applies {g:citadel_inline_attribute:'KnockUp'}, {g:citadel_inline_attribute:'Slow'}, and deals {g:citadel_inline_attribute:'SpiritDamage'}.<br><br><span class=\"diminish\">Hold {g:citadel_binding:'Crouch'} to charge a high jump, release to jump.</span>",
          "plain_text": "Your bench's legs extend, granting bonus move speed, higher jumps, Debuff Resistance and Melee Resistance.\nLight Melee: Perform a kick that knocks enemies back.\nHeavy Melee: Perform a ground pound that applies knockup, slow, and deals spirit damage.\nHold [Crouch] to charge a high jump, release to jump."
        },
