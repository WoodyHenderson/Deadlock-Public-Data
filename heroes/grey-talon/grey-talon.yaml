          ],
          "source": "github.deadlock-data.english.311b2e8d895e",
          "raw_text": "<span class=\"highlight\">Throw out a trap</span> that begins to arm itself. Once armed, the trap will trigger when an enemy enters its radius, applying <span class=\"highlight\">Curse and Movement Slow</span> that <span class=\"highlight\">interrupts, Silences, Disarms</span>, and <span class=\"highlight\">prevents item usage</span>.<br>Hit the trap with a Charged Shot to detonate early with increased radius.",
