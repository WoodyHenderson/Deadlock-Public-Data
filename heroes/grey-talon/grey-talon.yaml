      "descriptions": [
        {
          "localization_key": "ability_power_jump_desc",
          "card_paths": [
            "card.DescKey",
            "card.Info1.DescKey"
          ],
          "source": "github.deadlock-data.english.311b2e8d895e",
          "raw_text": "Launches you high in the air, allowing you to glide slowly. While airborne, you gain <span class=\"highlight\">Weapon Damage</span> and <span class=\"highlight\">multishot on your weapon</span>. <br>{g:citadel_binding:'AltCast'}for reduced jump height.  <br>Press{g:citadel_binding:'Mantle'}to cancel the glide.",
