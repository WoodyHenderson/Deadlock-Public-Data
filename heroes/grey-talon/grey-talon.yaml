          "source": "github.deadlock-data.english.311b2e8d895e",
          "raw_text": "While airborne, <span class=\"highlight\">+30%</span> Bullet Lifesteal, <span class=\"highlight\">+30%</span> Spirit Lifesteal and <span class=\"highlight\">+30%</span> Bullet Evasion",
