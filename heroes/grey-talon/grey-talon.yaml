        },
        {
          "localization_key": "ability_power_jump_t1_desc",
          "card_paths": [
            "card.Upgrades[0].DescKey"
          ],
          "source": "github.deadlock-data.english.311b2e8d895e",
          "raw_text": "While airborne, <span class=\"highlight\">+3</span> Weapon Damage and weapon damage applies <span class=\"highlight\">30%</span> movement slow for 1.5s",
          "plain_text": "While airborne, +3 Weapon Damage and weapon damage applies 30% movement slow for 1.5s"
        },
        {
          "localization_key": "ability_power_jump_t3_desc",
