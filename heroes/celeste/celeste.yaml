          "card_paths": [
            "card.DescKey",
            "card.Info1.DescKey"
          ],
          "source": "github.deadlock-data.english.311b2e8d895e",
          "raw_text": "Call down a beam of light from the sky. After a short duration, the beam will fully form, causing an explosion that deals {g:citadel_inline_attribute:'SpiritDamage'} to all targets in the area.<br><br> Celeste will receive a stacking buff that increases her spirit damage anytime this hits an enemy hero.",
          "plain_text": "Call down a beam of light from the sky. After a short duration, the beam will fully form, causing an explosion that deals spirit damage to all targets in the area.\nCeleste will receive a stacking buff that increases her spirit damage anytime this hits an enemy hero."
