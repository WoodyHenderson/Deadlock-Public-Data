      "descriptions": [
        {
          "localization_key": "ability_explosive_barrel_desc",
          "card_paths": [
            "card.DescKey",
            "card.Info1.DescKey"
          ],
          "source": "github.deadlock-data.english.311b2e8d895e",
          "raw_text": "Throw a barrel that explodes after a delay, dealing {g:citadel_inline_attribute:'SpiritDamage'}, <span class=\"highlight\">setting enemies on fire</span> and applying {g:citadel_inline_attribute:'KnockUp'}. <br><br> The barrel can be detonated early by being <span class=\"highlight\">shot</span>, <span class=\"highlight\">melee'd</span>, or <span class=\"highlight\">detonated</span> by another barrel.  <br><br><span class=\"diminish\">The burn stacks, so overlapping barrels burn for their combined damage.<br>Can be Alt-Cast to place the barrel infront of Holliday.</span>",
          "plain_text": "Throw a barrel that explodes after a delay, dealing spirit damage, setting enemies on fire and applying knockup.\nThe barrel can be detonated early by being shot, melee'd, or detonated by another barrel.\nThe burn stacks, so overlapping barrels burn for their combined damage.\nCan be Alt-Cast to place the barrel infront of Holliday."
        },
        {
          "localization_key": "ability_explosive_barrel_t3_desc",
          "card_paths": [
            "card.Upgrades[2].DescKey"
          ],
          "source": "github.deadlock-data.english.311b2e8d895e",
          "raw_text": "<span class=\"highlight\">+40</span> Impact Damage<br><span class=\"highlight\">+13.3333</span> Burn Damage per Second<br><span class=\"highlight\">-5</span> Charge Time<br><span class=\"highlight\">Improved Spirit Scaling</span>",
