          "source": "github.deadlock-data.english.311b2e8d895e",
          "raw_text": "Drop a bounce pad in the world that <span class=\"highlight\">launches any hero</span>. <br><br>You <span class=\"highlight\">explode</span> on landing, dealing <Panel class=\"AbilityPropertyIcon prop_tech_damage\"> <span class=\"highlight_spirit\">Damage</span> to any nearby enemies. <br><br><span class=\"diminish\">The explosion can only occur once per person per Bounce Pad.</span>",
