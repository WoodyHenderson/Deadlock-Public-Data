          "source": "github.deadlock-data.english.311b2e8d895e",
          "raw_text": "Focus on enemies to connect whips to them. After channeling, connected enemies are <span class=\"highlight\">lifted and stunned</span> then slammed into the ground. Your victims and any enemies in the landing zone will be <span class=\"highlight\">damaged and slowed</span>. <br>Press{g:citadel_binding:'Attack'}to throw connected enemies early. Enemies that are not in line of sight or go out of range during the latch time will not be grabbed.",
          "plain_text": "Focus on enemies to connect whips to them. After channeling, connected enemies are lifted and stunned then slammed into the ground. Your victims and any enemies in the landing zone will be damaged and slowed.\nPress [Attack] to throw connected enemies early. Enemies that are not in line of sight or go out of range during the latch time will not be grabbed."
