          ],
          "source": "github.deadlock-data.english.311b2e8d895e",
          "raw_text": "When enemy heroes are <span class=\"highlight\">low on health</span> you deal <span class=\"highlight\">amplified damage</span> against them. These enemies leave a <span class=\"highlight\">lingering blood trail</span> as they move.",
