            "card.Info1.DescKey"
          ],
          "source": "github.deadlock-data.english.311b2e8d895e",
          "raw_text": "<span class=\"highlight\">Isolated</span> heroes leave a trail as they move, and emit their heartbeat from afar. <br><br>You deal <span class=\"highlight\">amplified damage</span> against <span class=\"highlight\">isolated</span> heroes, and when isolated heroes die nearby you gain permanent {g:citadel_inline_attribute:'WeaponDamage'}.",
