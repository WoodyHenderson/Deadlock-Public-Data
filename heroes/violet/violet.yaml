      "descriptions": [
        {
          "localization_key": "ability_artist_homingbrush_desc_active",
          "card_paths": [
            "card.Info1.DescKey"
          ],
          "source": "github.deadlock-data.english.596ad0c74b26",
          "raw_text": "<span class=\"diminish\">Empower ({g:citadel_binding:'ABILITY1'}):</span> Your next <span class=\"highlight\">3</span> bullets come to life, allowing you to steer them as they travel. The bullets deal increased {g:citadel_inline_attribute:'BulletDamage'} and splash {g:citadel_inline_attribute:'SpiritDamage'} in a small area.<br><br>Each successful hit against a hero reduces <span class=\"highlight\">all ability cooldowns</span>, and half for <span class=\"highlight\">all item cooldowns</span>.",
          "plain_text": "Empower ( [ABILITY1] ): Your next 3 bullets come to life, allowing you to steer them as they travel. The bullets deal increased bullet damage and splash spirit damage in a small area.\nEach successful hit against a hero reduces all ability cooldowns, and half for all item cooldowns."
        },
        {
          "localization_key": "ability_artist_homingbrush_desc_active_alt",
          "card_paths": [
            "card.Info2.DescKey"
          ],
          "source": "github.deadlock-data.english.596ad0c74b26",
          "raw_text": "<span class=\"diminish\">Draw ({g:citadel_binding:'ADS'}):</span> Paint a solid stroke of ink instead that blocks projectiles and characters from passing through.<br><br>The stroke can be destroyed with a heavy melee, but deals {g:citadel_inline_attribute:'SpiritDamage'} to the attacker.</span>",
          "plain_text": "Draw ( [ADS] ): Paint a solid stroke of ink instead that blocks projectiles and characters from passing through.\nThe stroke can be destroyed with a heavy melee, but deals spirit damage to the attacker."
