      "descriptions": [
        {
          "localization_key": "ability_fencer_lunge_desc",
          "card_paths": [
            "card.DescKey",
            "card.Info1.DescKey"
          ],
          "source": "github.deadlock-data.english.311b2e8d895e",
          "raw_text": "Perform a series of lunges in any direction, delivering piercing stabs ahead of you. Hold your ability key to time your attacks, dealing more damage the longer it's held. Releasing your attack during the <span class=\"highlight\">perfect window</span> deals <span class=\"highlight\">maximum damage</span>.<br><br><span class=\"diminish\">Press {g:citadel_binding:'Ability3'} to re-cast.</span>",
          "plain_text": "Perform a series of lunges in any direction, delivering piercing stabs ahead of you. Hold your ability key to time your attacks, dealing more damage the longer it's held. Releasing your attack during the perfect window deals maximum damage.\nPress [Ability 3] to re-cast."
        },
        {
          "localization_key": "ability_fencer_lunge_t1_desc",
          "card_paths": [
            "card.Upgrades[0].DescKey"
