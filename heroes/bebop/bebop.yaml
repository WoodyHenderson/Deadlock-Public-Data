          ],
          "source": "github.deadlock-data.english.311b2e8d895e",
          "raw_text": "Attach a bomb that explodes after a delay, dealing {g:citadel_inline_attribute:'SpiritDamage'} to nearby enemies. <br><br>If the bomb hits or kills a hero, you gain <span class=\"highlight\">permanent bonus damage</span> on Sticky Bomb. <br><br><span class=\"diminish\">Stacks diminish by half after 60 hits and 7 kills",
