      "descriptions": [
        {
          "localization_key": "citadel_ability_uppercut_desc",
          "card_paths": [
            "card.DescKey",
            "card.Info1.DescKey"
          ],
          "source": "github.deadlock-data.english.311b2e8d895e",
          "raw_text": "Deal {g:citadel_inline_attribute:'MeleeDamage'} to nearby enemies and apply {g:citadel_inline_attribute:'KnockBack'}. <br><br>When they land, they deal {g:citadel_inline_attribute:'SpiritDamage'} and apply {g:citadel_inline_attribute:'ReducedFireRate'} to other nearby enemies. <br><br><span class=\"diminish\">Exploding Uppercut can be used on allies.</br>",
          "plain_text": "Deal melee damage to nearby enemies and apply knockback.\nWhen they land, they deal spirit damage and apply reduced fire rate to other nearby enemies.\nExploding Uppercut can be used on allies."
        },
        {
          "localization_key": "citadel_ability_uppercut_t2_desc",
          "card_paths": [
            "card.Upgrades[1].DescKey"
          ],
          "source": "github.deadlock-data.english.311b2e8d895e",
          "raw_text": "On Hero Hit: Gain <span class=\"highlight\">fast spin-up time, 2x weapon range and +30% weapon damage</span> for 9s",
          "plain_text": "On Hero Hit: Gain fast spin-up time, 2x weapon range and +30% weapon damage for 9s"
        },
        {
          "localization_key": "citadel_ability_uppercut_t3_desc",
          "card_paths": [
            "card.Upgrades[2].DescKey"
          ],
          "source": "github.deadlock-data.english.311b2e8d895e",
          "raw_text": "On Hero Hit: Set <span class=\"highlight\">Grapple Arm cooldown to 0</span> and restores <span class=\"highlight\">+18%</span> of your missing health",
          "plain_text": "On Hero Hit: Set Grapple Arm cooldown to 0 and restores +18% of your missing health"
        }
      ]
    },
