      "descriptions": [
        {
          "localization_key": "citadel_ability_card_toss_desc",
          "card_paths": [
            "card.DescKey",
            "card.Info1.DescKey"
          ],
          "source": "github.deadlock-data.english.311b2e8d895e",
          "raw_text": "Deal weapon damage to summon cards of a random suit. Each card can be thrown, dealing damage and applying a different effect depending of its suit. Cards thrown fly towards the enemy or point under your crosshair. <br><br><span class=\"diminish\">Alt-cast to throw first card</span>",
          "plain_text": "Deal weapon damage to summon cards of a random suit. Each card can be thrown, dealing damage and applying a different effect depending of its suit. Cards thrown fly towards the enemy or point under your crosshair.\nAlt-cast to throw first card"
        },
        {
          "localization_key": "ability_header_card_toss_suits_desc",
          "card_paths": [
            "card.Info2.DescKey"
          ],
          "source": "github.deadlock-data.english.311b2e8d895e",
          "raw_text": "<br>Each suit provides a different bonus. <span class=\"highlight\">Jokers</span> counts as all suits</span>",
          "plain_text": "Each suit provides a different bonus. Jokers counts as all suits"
        },
        {
          "localization_key": "citadel_ability_card_toss_t2_desc",
          "card_paths": [
            "card.Upgrades[1].DescKey"
          ],
          "source": "github.deadlock-data.english.311b2e8d895e",
          "raw_text": "+40 Damage and increased Spirit Scaling",
          "plain_text": "+40 Damage and increased Spirit Scaling"
        },
        {
          "localization_key": "citadel_ability_card_toss_t3_desc",
          "card_paths": [
            "card.Upgrades[2].DescKey"
          ],
          "source": "github.deadlock-data.english.311b2e8d895e",
          "raw_text": "All suits are improved and higher chance for <span class=\"highlight\">Jokers</span>",
          "plain_text": "All suits are improved and higher chance for Jokers"
        }
      ]
    },
