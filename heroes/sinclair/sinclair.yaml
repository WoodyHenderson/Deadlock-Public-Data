          "source": "github.deadlock-data.english.311b2e8d895e",
          "raw_text": "Summon an <span class=\"highlight\">Assistant</span> at the targeted location. The <span class=\"highlight\">Assistant</span> attacks whenever you fire your weapon, dealing <Panel class=\"AbilityPropertyIcon prop_tech_damage\"> <span class=\"highlight_spirit\">Damage</span>. <br><br>While the <span class=\"highlight\">Assistant</span> is out, you can press <span class=\"highlight\">{g:citadel_binding:'Ability2'}</span> to swap positions with your <span class=\"highlight\">Assistant</span>. <br><br><span class=\"diminish\">Casting Spectral Assistant also reloads your weapon.</span>",
