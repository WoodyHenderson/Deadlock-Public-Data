      "descriptions": [
        {
          "localization_key": "ability_magician_magicbolt_desc",
          "card_paths": [
            "card.DescKey",
            "card.Info1.DescKey"
          ],
          "source": "github.deadlock-data.english.311b2e8d895e",
          "raw_text": "Fire a bolt of magic that deals <Panel class=\"AbilityPropertyIcon prop_tech_damage\"> <span class=\"highlight_spirit\">Damage</span>, <span class=\"highlight\">increasing as it travels</span>. If you have an <span class=\"highlight\">Assistant</span>, they also cast Vexing Bolt at reduced damage. <br><br>Press <span class=\"highlight\">{g:citadel_binding:'Ability1'}</span> to <span class=\"highlight\">redirect</span> the bolt towards your crosshairs.",
          "plain_text": "Fire a bolt of magic that deals Damage, increasing as it travels. If you have an Assistant, they also cast Vexing Bolt at reduced damage.\nPress [Ability 1] to redirect the bolt towards your crosshairs."
        },
        {
          "localization_key": "ability_magician_magicbolt_t1_desc",
          "card_paths": [
            "card.Upgrades[0].DescKey"
          ],
          "source": "github.deadlock-data.english.311b2e8d895e",
          "raw_text": "Bolts apply <span class=\"highlight\">-25%</span> Fire Rate for <span class=\"highlight\">5</span>s.",
          "plain_text": "Bolts apply -25% Fire Rate for 5s."
        },
        {
          "localization_key": "ability_magician_magicbolt_t3_desc",
          "card_paths": [
            "card.Upgrades[2].DescKey"
          ],
          "source": "github.deadlock-data.english.311b2e8d895e",
          "raw_text": "<span class=\"highlight\">+126</span> Max Damage. +<span class=\"highlight\">50%</span> Assistant Damage.",
          "plain_text": "+126 Max Damage. +50% Assistant Damage."
        }
      ]
