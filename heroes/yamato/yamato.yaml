          "raw_text": "Become infused with Yamato's shadow soul. After an initial <span class=\"highlight\">invincible</span> transformation your <span class=\"highlight\">abilities are refreshed and are 60% faster</span>. You gain <span class=\"highlight\">immunity to negative status effects</span> and have greatly increased <span class=\"highlight\">bullet and spirit resist</span>.<br>When you get a hero kill, you <span class=\"highlight\">heal</span> and the <span class=\"highlight\">duration</span> is extended.",
