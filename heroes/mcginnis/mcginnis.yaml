          "raw_text": "Cast a wall that <span class=\"highlight\">applies slow</span> on enemies it passes through.  Erupt the wall to <span class=\"highlight\">divide the terrain</span> in half and <span class=\"highlight\">damage</span> nearby enemies. <br>After casting, press{g:citadel_binding:'Attack'}or{g:citadel_binding:'Ability3'}to erupt the wall early.  <br><br><span class=\"diminish\">Can be Destroyed with Melee Attacks</span>",
