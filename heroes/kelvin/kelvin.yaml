          ],
          "source": "github.deadlock-data.english.311b2e8d895e",
          "raw_text": "Kelvin creates a <span class=\"highlight\">floating trail</span> of ice and snow that gives movement bonuses to him and his allies. Kelvin gains 60% slow resistance for the duration. Enemies can also walk on the floating trail. <br>Press {g:citadel_binding:'Roll'} / {g:citadel_binding:'Crouch'} to travel up or down while in Ice Path.",
