      "descriptions": [
        {
          "localization_key": "citadel_ability_shiv_killing_blow_active_desc",
          "card_paths": [
            "card.Info1.DescKey"
          ],
          "source": "github.deadlock-data.english.311b2e8d895e",
          "raw_text": "<span class=\"diminish\">Active:</span> Leap forward, dealing {g:citadel_inline_attribute:'SpiritDamage'} to the first enemy hero. If they are below the <span class=\"highlight\">kill threshold</span>, <span class=\"highlight\">execute</span> them instead.<br><br>Finishing an enemy with Killing Blow lets you recast for <span class=\"highlight\">16s</span>",
          "plain_text": "Active: Leap forward, dealing spirit damage to the first enemy hero. If they are below the kill threshold, execute them instead.\nFinishing an enemy with Killing Blow lets you recast for 16s"
        },
        {
          "localization_key": "citadel_ability_shiv_killing_blow_passive_desc",
          "card_paths": [
            "card.Info2.DescKey"
          ],
          "source": "github.deadlock-data.english.311b2e8d895e",
          "raw_text": "<span class=\"diminish\">Passive:</span> Damaging enemies fills you with rage. While at full rage, Shiv gains increased damage and <span class=\"highlight\">unlocks special properties</span> on his other abilities.",
          "plain_text": "Passive: Damaging enemies fills you with rage. While at full rage, Shiv gains increased damage and unlocks special properties on his other abilities."
        },
        {
          "localization_key": "citadel_ability_shiv_killing_blow_passive_desc_footer",
          "card_paths": [
            "card.Info3.DescKey"
          ],
          "source": "github.deadlock-data.english.311b2e8d895e",
          "raw_text": "<br><span class=\"diminish\">Cooldown is increased by +30% if no hero is impacted.</span>",
          "plain_text": "Cooldown is increased by +30% if no hero is impacted."
        },
        {
          "localization_key": "citadel_ability_shiv_killing_blow_t1_desc",
