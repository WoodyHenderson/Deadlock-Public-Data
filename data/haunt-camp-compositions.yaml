ordinary_camp_patterns:
  small:
    source: wiki.haunt.177431
    members: [{tier: small, count: 3}]
    family: null
  medium:
    source: wiki.haunt.177431
    reported_combination_count: 6
    member_tiers: [small, medium]
    exact_combinations: null
    family: null
    note: The article states six combinations but does not enumerate their unit counts or named locations.
  large:
    source: wiki.haunt.177431
    minimum_large_haunts: 1
    possible_companion_tiers: [small, medium, large]
    reported_three_large_camp_count: 6
    exact_per_location_compositions: null
    family: null
    later_description:
      source: wiki.haunt.181836
      alternatives:
        - [{tier: large, count: 3}]
        - [{tier: large, count: 1}, {tier: medium, count: 2}]
      note: >-
        The October 6 prose narrows the alternatives and omits the old six-camp
        count. This is a later article description, not proof of an intervening
        game change or the composition of each large marker.

sinner_site_patterns:
  source: wiki.sinners-sacrifice.177553
  site_count: 11
  machine_count: 15
  configurations:
    - id: single-machine
      site_count: 6
      machines_per_site: 1
      medium_haunts_per_site: 0
    - id: single-machine-hybrid
      site_count: 2
      machines_per_site: 1
      medium_haunts_per_site: 2
    - id: double-machine-hybrid
      site_count: 2
      machines_per_site: 2
      medium_haunts_per_site: 1
    - id: triple-machine
      site_count: 1
      machines_per_site: 3
      medium_haunts_per_site: 0
  derived_totals:
    hybrid_sites: 4
    companion_medium_haunts: 6
    derivation: Sum site_count times medium_haunts_per_site; do not add this to the ordinary camp count.
  clear_rule:
    source: wiki.sinners-sacrifice.177553
    requires_all_machines_destroyed: true
    requires_all_member_haunts_killed: true
    requires_nearby_crates_or_buff_containers_destroyed: false
    evidence_status: source_verified_wiki_not_independently_runtime_tested
  named_wiki_context:
    source: wiki.sinners-sacrifice.181842
    bell_tower: Three machines at the top of the Bell Tower in Chinatown.
    sunken_plaza: Two Sinner sites alongside two Haunt camps; this wording alone does not assign unit counts or families to each marker.

