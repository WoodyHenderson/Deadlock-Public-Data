  note: >-
    Article prose is pinned independently of transcluded NPC templates. No live
    template values are imported here. October 6 article differences are not
    backdated or interpreted as a gameplay patch. Applying the coordinate layer
    to September 29 uses the documented unchanged-placement working assumption,
    not independent patch-time verification. Null means not established.

