schema_version: 1
id: data.general.universal-rules
snapshot_id: deadlock-wiki-2026-09-03
current_as_of: "2026-09-03"
evidence_status: source_verified
sources:
  - wiki.movement.78724
  - wiki.melee-attack.114941
  - wiki.health.111364
  - wiki.death.95455
  - wiki.crowd-control.110151
  - wiki.backdoor-protection.78476
  - wiki.damage-resistance.125735
  - wiki.healing.96635
  - wiki.fire-rate.110395
  - wiki.lifesteal.146618
  - wiki.warden.125788
  - wiki.data-ability-data.114011
  - wiki.data-ability-cards.114010
  - github.deadlock-data.english.311b2e8d895e
  - deadlock-api.items.client-6684.source-10933105

movement:
  no_fall_damage: true
  sprint_out_of_combat_delay_seconds: 5
  move_speed:
    bonus_stacking: diminishing_returns
    bonus_formula: "12 * (1 - product(1 - each_bonus_meters_per_second / 12))"
    sprint_bonus_stacking: additive
    sprint_speed_ramp_threshold_meters_per_second: 2.5
    sprint_speed_ramp_meters_per_second_per_second: 0.6
    firing_speed_multiplier: 0.75
    firing_penalty_exceptions: [rem, silver_transformed]
    crouch_speed_meters_per_second: 4.8
    firing_crouch_speed_exceptions:
      grey_talon: 4.4
      warden: 4.4
    source: wiki.move-speed.146579
  sprint_state:
    reset_events:
      - enemy_hero_damage
      - enemy_hero_shot
      - stun
      - immobilize
      - displace
      - sleep
      - zipline_use
      - crouch
      - stopped_movement_input
      - zoom
    non_reset_events:
      - light_melee
      - heavy_melee
      - neutral_camp_shot_without_damage_taken
      - breakable_shot
      - slide
      - teleporter_use
      - magic_carpet
      - walking_into_walls_or_corners
    source: wiki.move-speed.146579
  slide_threshold_meters_per_second: null
  slide_threshold_evidence_status: source_conflict
  slide_threshold_review_id: review.slide-speed-threshold
  slide_grants_infinite_ammo: true
  actions:
    ground_dash: { stamina_cost: 1 }
    air_dash: { stamina_cost: 1, baseline_limit_per_jump: 1 }
    air_jump: { stamina_cost: 1, baseline_limit_per_jump: 1 }
    dash_jump: { total_stamina_cost: 2 }
    down_dash: { stamina_cost: 0.5, baseline_limit_per_jump: 1 }
    first_wall_jump: { stamina_cost: 0 }
    subsequent_wall_jump: { stamina_cost: 0.5 }
  climbing_melee_slow:
    starts_percent: 80
    tapers_to_percent: 20
    duration_seconds: 2

fire_rate:
  source: wiki.fire-rate.110395
  accessed_at: "2026-09-11"
  evidence_status: source_verified
  scope: Wiki general rate calculation; not a verified transform for individual burst timers.
  percentage_inputs: fractions
  slow_input_convention: Positive fractions denote reductions, e.g. 0.25 for a 25% slow.
  preconditions: Resolve active bonuses and slows from the owning effect records first.
  bonus_stacking: additive
  total_bonus_formula: sum(each_bonus)
  slow_stacking: complement_product
  total_slow_formula: 1 - product(1 - each_slow)
  empty_group_contribution: 0
  total_modifier_formula: max(-0.50, total_bonus - total_slow)
  minimum_total_modifier: -0.50
  positive_cap: null
  positive_cap_status: not_established_by_source
  rate_formula_nonnegative_modifier: base_rate * (1 + total_modifier)
  rate_formula_negative_modifier: base_rate / (1 + abs(total_modifier))
  equivalent_interval_formulas:
    evidence_status: derived
    nonnegative_modifier: base_interval / (1 + total_modifier)
    negative_modifier: base_interval * (1 + abs(total_modifier))
    scope: Algebraic equivalents for a rate, not individual burst timer behavior.
  ui_reports: combined_modifier_not_actual_fractional_change_in_shots_per_second
  rounding: Retain intermediate precision; round only for display.
  unresolved:
    - wind_up_timing_transforms
  burst_weapon_scope: See data/burst-weapons.yaml for the separately labeled working model and evidence limits.
  not_supplied_by_this_rule:
    - reload_and_sustained_dps
    - effect_specific_proc_conditions_or_cooldowns

melee:
  weapon_damage_bonus_conversion_fraction: 0.5
  heavy_melee:
    cooldown_seconds: 1
    missed_cooldown_seconds: 1.3
    required_to_claim:
      - powerup
      - rejuvenator-credit
      - unsecured-soul-container
  sinners_sacrifice_retaliation_damage_per_hit: 80
  trooper_melee_last_hit_releases_orbs: false
  trooper_melee_last_hit_awards_full_bounty: true

parry:
  animation_seconds: 1
  active_window_seconds: 0.75
  failed_cooldown_seconds: 4.5
  successful_recovery_seconds: 0.3
  attacker_stun_seconds: 2.75
  attacker_incoming_damage_multiplier: 1.25
  effects_ignore_debuff_resistance: true
  successful_hero_parry_refunds_cooldown: true
  trooper_parry_refunds_cooldown: false

health:
  maximum_health_formula: (starting_base_health + boon_health) * (1 + base_health_bonus_fraction) + flat_bonus_health
  displayed_maximum_rounding: ceiling
  respawn_room:
    maximum_health_fraction_per_second: 0.06
    flat_health_per_second: 60

healing:
  total_reduction_formula: 1 - product(1 - each_reduction)
  final_healing_formula: initial_healing * (1 - total_reduction) * (1 + healing_amp)
  duplicate_same_source_stacks: false
  lifesteal:
    domains:
      bullet:
        damage_type: bullet
        non_hero_effectiveness: 0.60
      spirit:
        damage_type: spirit
        non_hero_effectiveness: 0.40
      melee:
        damage_type: melee
        non_hero_effectiveness: 0.40
        note: Applies to continuously active melee lifesteal; proc items can define their own non-hero behavior.
    same_domain_stacking_formula: 1 - product(1 - each_lifesteal_source)
    stacking_scope: Compatible sources of the same lifesteal stat, not arbitrary ability heals or item procs.
    formula_percentage_inputs: fractions
    domains_calculated_independently: true
    source_specific_non_hero_factor_overrides_domain_default: true
    target_resolution:
      required_context: [effect, target_type, upgrade_tier, game_mode]
      distinguish: [absolute_damage_to_heal_fraction, multiplier_on_proc_heal]
      apply_generic_npc_reduction_to_explicit_npc_value: false
      override_scope: Only the named effect; other lifesteal sources retain their own rules.
      separate_ability_heal_and_purchased_lifesteal_combination: needs_primary_verification
    target_specific_effects:
      - id: abrams.siphon-life
        record: heroes/abrams/abrams.yaml
        ability_key: citadel_ability_bull_heal
        source_fields: [HealingFactor, NonHeroHealingFactor]
        value_kind: absolute_damage_to_heal_fraction
        hero: 0.70
        non_hero: 0.35
        source: wiki.data-ability-data.114011
      - id: bebop.hyper-beam.tier-3
        record: heroes/bebop/bebop.yaml
        source_fields: [BeamLifesteal, BeamLifestealNonHeroPercent]
        required_upgrade_tier: 3
        value_kind: absolute_damage_to_heal_fraction
        hero: 0.65
        non_hero: 0.20
        source: github.deadlock-data.english.311b2e8d895e
      - id: warden.last-stand
        record: heroes/warden/warden.yaml
        source_fields: [HealthStealPctHero, HealthStealPct]
        game_mode: standard
        value_kind: absolute_damage_to_heal_fraction
        hero: 0.75
        non_hero: 0.10
        source: wiki.data-ability-data.114011
      - id: warden.last-stand.street-brawl
        record: heroes/warden/warden.yaml
        game_mode: street_brawl
        value_kind: absolute_damage_to_heal_fraction
        hero: 0.4875
        non_hero: 0.075
        source: wiki.warden.125788
      - id: lash.flog
        record: heroes/lash/lash.yaml
        source_fields: [HealPctVsHeroes, HealPctVsNonHeroes]
        value_kind: absolute_damage_to_heal_fraction
        hero: 0.50
        non_hero: 0.16
        tier_3_additive_fraction_deltas: {hero: 0.20, non_hero: 0.06}
        source: wiki.data-ability-data.114011
      - id: mo-and-krill.scorn
        record: heroes/mo-and-krill/mo-and-krill.yaml
        source_fields: [DamageHealMult, DamageHealMultNonHero]
        value_kind: absolute_damage_to_heal_fraction
        hero: 1.2
        non_hero: 0.35
        source: wiki.data-ability-data.114011
      - id: item.melee-lifesteal
        record: items/melee-lifesteal/melee-lifesteal.yaml
        value_kind: multiplier_on_proc_heal
        base_proc_heal: 100
        hero: 1.0
        non_hero: 0.30
        light_melee_cooldown_multiplier: 1.5
        source: deadlock-api.items.client-6684.source-10933105
      - id: item.lifestrike
        record: items/lifestrike/lifestrike.yaml
        value_kind: multiplier_on_proc_heal
        base_proc_heal_formula: 100 + 0.30 * melee_damage_dealt
        hero: 1.0
        non_hero: 0.40
        light_melee_cooldown_multiplier: 1.5
        source: deadlock-api.items.client-6684.source-10933105
    target_specific_values_scope: >-
      Base values except explicit tier/mode overrides, before applicable upgrades,
      healing modifiers, separate lifesteal sources, and available-health caps.
      Generic non-hero defaults do not themselves establish target eligibility.
    ability_only_lifesteal:
      - record: heroes/mo-and-krill/mo-and-krill.yaml
        ability: Combo
        required_upgrade_tier: 1
        lifesteal_percent: 100
        applies_to: Combo damage only
      - record: heroes/infernus/infernus.yaml
        ability: Concussive Combustion
        required_upgrade_tier: 2
        lifesteal_percent: 100
        applies_to: Explosion damage only
    ability_only_lifesteal_source: github.deadlock-data.english.311b2e8d895e
    melee_item_proc_distinction: >-
      Melee Lifesteal provides a flat proc heal; Lifestrike provides a flat plus
      damage-based proc heal. Neither is a continuous global lifesteal stat.
      Their cooldowns do not block healing from other sources.
    source: wiki.lifesteal.146618

damage_resistance:
  total_resistance_formula: 1 - product(1 - each_resistance)
  total_reduction_formula: 1 - product(1 - each_resistance_reduction)
  final_resistance_formula: total_resistance - total_reduction
  negative_final_resistance_increases_damage: true
  classifications:
    weapon: [bullet_resistance]
    melee:
      parent_classification: weapon
      resistances: [bullet_resistance, melee_resistance]
      counts_for_weapon_damage_triggers: true
    spirit: [spirit_resistance]
    pure: []
  melee_resistance_relationship:
    directional_rule: >-
      Bullet Resistance also applies against Melee Damage, but Melee Resistance
      does not apply against ordinary Bullet/Weapon Damage.
    combination_formula: "melee_resistance_total = 1 - ((1 - bullet_resistance) * (1 - melee_resistance))"
    example: "30% Bullet Resistance and 20% Melee Resistance combine to 44% resistance against Melee Damage."

crowd_control:
  movement_slow_minimum_speed_meters_per_second: 2
  sleep_speed_meters_per_second: 2
  diminishing_returns:
    recent_effect_window_seconds: 9
    minimum_reduction_fraction: 0.15
    maximum_reduction_fraction: 0.35
    qualifying_effects:
      - stun
      - sleep
      - immobilize
      - chain
      - silence
  slow_resistance_formula: base_speed * (1 - slow * (1 - slow_resistance))

respawn:
  interpolation: linear_between_control_points
  cap_seconds: 90
  control_points:
    - { match_time_seconds: 300, respawn_seconds: 8 }
    - { match_time_seconds: 1200, respawn_seconds: 35 }
    - { match_time_seconds: 1800, respawn_seconds: 70 }
    - { match_time_seconds: 2400, respawn_seconds: 85 }
  unassisted_non_player_death_additional_seconds: 10
  last_stand:
    - condition: remaining_seconds >= 30
      operation: subtract
      value_seconds: 20
    - condition: 10 < remaining_seconds < 30
      operation: set
      value_seconds: 10
    - condition: remaining_seconds <= 10
      operation: unchanged
  rejuvenator:
    maximum_team_credits: 3
    claim_method: heavy_melee
    credits_per_claim_hit: 1
    revive_delay_seconds: 3
    revive_location: death_location

backdoor_protection:
  excludes_standard_lane_guardians: true
  reapplication_buffer_seconds: 14
  remove_condition: enemy_troopers_near_structure
  base_remove_condition: any_enemy_trooper_wave_pushed_to_base
  structures:
    walker: { damage_resistance_fraction: 0.65, health_regen_per_second: 65 }
    base_guardian: { damage_resistance_fraction: 0.65, health_regen_per_second: 65 }
    shrine: { damage_resistance_fraction: 0.65, health_regen_per_second: 65 }
    patron: { damage_resistance_fraction: 0.65, health_regen_per_second: 75 }
  patron_out_of_combat_health_regen_per_second: 120
  proximity_bullet_resistance:
    base_guardian:
      initial_fraction: 0.4
      reduction_per_nearby_enemy_hero: 0.2
      minimum_fraction: 0
    shrine:
      initial_fraction: 0.6
      reduction_per_nearby_enemy_hero: 0.2
      minimum_fraction: 0
