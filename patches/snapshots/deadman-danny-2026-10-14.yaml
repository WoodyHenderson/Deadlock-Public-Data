      "descriptions": [
        {
          "localization_key": "ability_deadpack_rocketeer_desc",
          "card_paths": [
            "card.DescKey",
            "card.Info1.DescKey"
          ],
          "source": "github.deadlock-data.english.bd95f245ccb1",
          "raw_text": "Hold {g:citadel_binding:'Mantle'} to fly, building up heat. When max heat is reached, your jetpack will begin to overheat.<br><br><span class=\"diminish\">Overheating:</span> After a short delay, <span class=\"highlight\">dive to the ground.</span> Upon impact, create an explosion that <span class=\"highlight\">deals damage</span> and launches you and nearby enemies. If no hero is hit, you stun yourself. Press {g:citadel_binding:'Ability2'} to dive early.<br><br><span class=\"diminish\">Cooling Down:</span> After overheating, the jetpack cannot be used until it fully cools down.<br><br><span class=\"small_diminish\">Slows affect you while airborne. You always explode on death.</span>",
          "plain_text": "Hold [Mantle] to fly, building up heat. When max heat is reached, your jetpack will begin to overheat.\nOverheating: After a short delay, dive to the ground. Upon impact, create an explosion that deals damage and launches you and nearby enemies. If no hero is hit, you stun yourself. Press [Ability 2] to dive early.\nCooling Down: After overheating, the jetpack cannot be used until it fully cools down.\nSlows affect you while airborne. You always explode on death."
        },
        {
          "localization_key": "ability_deadpack_rocketeer_t1_desc",
          "card_paths": [
            "card.Upgrades[0].DescKey"
          ],
          "source": "github.deadlock-data.english.bd95f245ccb1",
          "raw_text": "Heat vents faster while grounded",
          "plain_text": "Heat vents faster while grounded"
        },
        {
          "localization_key": "ability_deadpack_rocketeer_t2_desc",
          "card_paths": [
            "card.Upgrades[1].DescKey"
          ],
          "source": "github.deadlock-data.english.bd95f245ccb1",
          "raw_text": "On Hero Hit: Heal and take no self damage",
          "plain_text": "On Hero Hit: Heal and take no self damage"
        },
        {
          "localization_key": "ability_deadpack_rocketeer_t3_desc",
