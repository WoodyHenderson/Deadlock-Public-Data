          "source": "github.deadlock-data.english.bd95f245ccb1",
          "raw_text": "Launch a <span class=\"highlight\">salvo of spirit missiles that lodge into the ground along a line.</span> The missiles explode after a delay or upon detecting an enemy, dealing {g:citadel_inline_attribute:'SpiritDamage'} and <span class=\"highlight\">marking</span> the target.<br><br>Shooting a marked enemy with a charged shot consumes a mark to deal {g:citadel_inline_attribute:'BonusSpiritDamage'} and apply a fading {g:citadel_inline_attribute:'Slow'}.<br><br><span class=\"diminish\">Hold and drag to select the angle.</span>",
