          "source": "github.deadlock-data.english.330a775230e8",
          "raw_text": "Create a <span class=\"highlight\">bishop</span> that remains in place indefinitely. <br><br><span class=\"diminish\">Move ({g:citadel_binding:'ADS'}):</span> Moves the bishop, applying a fading {g:citadel_inline_attribute:'Slow'} and dealing {g:citadel_inline_attribute:'SpiritDamage'} to enemies it passes through. After a delay, activates diagonal squares that deal additional {g:citadel_inline_attribute:'SpiritDamage'} when stepped on.<br><br><span class=\"diminish\">Re-activate to recall all bishops, ending the ability.</span>",
          "plain_text": "Create a bishop that remains in place indefinitely.\nMove ( [ADS] ): Moves the bishop, applying a fading slow and dealing spirit damage to enemies it passes through. After a delay, activates diagonal squares that deal additional spirit damage when stepped on.\nRe-activate to recall all bishops, ending the ability."
